[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-trials-viz"
version = "0.1.0"
description = "Deterministic, citation-backed clinical trials visualizations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.68,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: calls the live ClinicalTrials.gov API"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
